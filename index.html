<style>

*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}.sidebar{width:252px;background:#143b29;color:#eaf2e9;padding:24px 16px;display:flex;flex-direction:column;flex-shrink:0}.brand{display:flex;align-items:center;gap:11px;padding:0 10px 25px;border-bottom:1px solid #ffffff20}.brandmark{width:42px;height:42px;border-radius:14px;background:#d9edbd;color:#174b32;display:grid;place-items:center;font-size:22px}.brand strong{font-size:18px;letter-spacing:.3px}.brand small{display:block;color:#b6cbb9;font-size:11px}.navlabel{font-size:10px;letter-spacing:1.5px;color:#91ad99;margin:24px 10px 8px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#d5e3d7;text-align:left;padding:11px 12px;border-radius:10px;display:flex;gap:12px;align-items:center;font-weight:500}.nav button:hover,.nav button.active{background:#ffffff19;color:white}.nav .ico{width:20px;text-align:center;font-size:16px}.sidebottom{margin-top:auto;padding:16px 10px 0;color:#9db6a3;font-size:11px}.main{min-width:0;flex:1}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:5}.crumb{font-size:12px;color:var(--muted)}.topbar h1{font-size:19px;margin:2px 0 0}.topactions{display:flex;gap:9px;align-items:center}.content{padding:30px 34px;max-width:1600px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}.welcome h2{font-size:24px;margin:0 0 4px}.welcome p{color:var(--muted);margin:0}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;color:var(--ink);font-weight:600}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.soft{background:#edf4e8;border-color:#edf4e8;color:var(--green)}.btn.danger{color:var(--red)}.btn:disabled{opacity:.5;cursor:not-allowed}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.stathead{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.staticon{width:32px;height:32px;border-radius:10px;background:#edf4e8;display:grid;place-items:center}.stat strong{font-size:25px;display:block;margin-top:12px;letter-spacing:-.5px}.stat small{color:var(--muted)}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:var(--shadow);margin-bottom:18px}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.panelhead h3{margin:0;font-size:15px}.panelhead p{margin:3px 0 0;color:var(--muted);font-size:12px}.dashgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}.bars{display:grid;gap:13px}.barrow{display:grid;grid-template-columns:115px 1fr 95px;gap:10px;align-items:center;font-size:12px}.track{height:9px;background:#eef2eb;border-radius:20px;overflow:hidden}.fill{height:100%;background:#57956a;border-radius:20px}.barvalue{text-align:right;font-weight:600}.alert{display:flex;gap:10px;padding:11px 12px;border-radius:10px;background:#fff7e9;color:#79551d;margin:8px 0;font-size:12px}.alert.red{background:#fff0ee;color:#98483e}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;min-width:720px}th,td{text-align:left;padding:11px 12px;border-bottom:1px solid #edf0eb;white-space:nowrap;font-size:12px}th{background:#f8faf6;color:#69776d;font-size:10px;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0}tr:last-child td{border-bottom:0}tbody tr:hover{background:#fbfcfa}.pill{display:inline-flex;border-radius:30px;padding:3px 8px;font-size:10px;font-weight:700;background:#edf4e8;color:#356b43}.pill.warn{background:#fff4df;color:#946316}.pill.bad{background:#ffedeb;color:#a7443a}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.search{border:1px solid var(--line);border-radius:9px;padding:9px 12px;min-width:220px;background:white}.muted{color:var(--muted)}.empty{padding:35px;text-align:center;color:var(--muted)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:700;color:#5f6f63}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;color:var(--ink)}.field textarea{min-height:75px;resize:vertical}.modal{position:fixed;inset:0;background:#10241980;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.dialog{background:white;border-radius:16px;padding:22px;width:min(700px,100%);max-height:90vh;overflow:auto}.dialoghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.dialoghead h3{margin:0}.close{border:0;background:#f1f4ef;border-radius:8px;padding:6px 10px}.dialogfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.hint{font-size:11px;color:var(--muted);margin-top:12px}.guide{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.guide article{padding:15px;border:1px solid var(--line);border-radius:12px}.guide b{display:block;margin-bottom:5px}.guide p{margin:0;color:var(--muted);font-size:12px}.mobilemenu{display:none}
@media(max-width:1050px){.sidebar{width:215px}.content{padding:24px}.cards{grid-template-columns:repeat(2,1fr)}.dashgrid{grid-template-columns:1fr}}
@media(max-width:720px){.shell{display:block}.sidebar{width:100%;padding:12px;position:relative}.brand{padding:0 5px 10px;border:0}.navlabel,.sidebottom{display:none}.nav{display:flex;overflow:auto;padding-top:10px}.nav button{white-space:nowrap;padding:8px 10px;font-size:11px}.nav .ico{display:none}.topbar{height:62px;padding:0 16px}.topactions .btn:not(.primary){display:none}.content{padding:18px 14px}.cards{gap:9px}.stat{padding:13px}.stat strong{font-size:20px}.welcome{gap:10px;flex-direction:column}.formgrid,.guide{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style></head>
<body><div class="shell">
<aside class="sidebar"><div class="brand"><div class="brandmark">🌱</div><div><strong>KEBUN59</strong><small>Garden & Nursery Manager</small></div></div>
<div class="navlabel">MENU UTAMA</div><nav class="nav" id="nav">

<button data-page="materials"><span class="ico">🧪</span>Stok Bahan</button>
<button data-page="care"><span class="ico">🪴</span>Log Perawatan</button>

<button data-page="guide"><span class="ico">📖</span>Panduan</button></nav><div class="sidebottom">Kebun59 · Kelola kebun lebih terarah<br>Data tersimpan di perangkat ini.</div></aside>
<main class="main"><header class="topbar"><div><div class="crumb">KEBUN59 / <span id="crumb">DASHBOARD</span></div><h1 id="pageTitle">Dashboard</h1></div><div class="topactions"><button class="btn" id="importBtn">↑ Import Excel</button><button class="btn" id="exportBtn">↓ Export Excel</button><button class="btn primary" id="topAdd">+ Tambah Data</button><input type="file" id="fileInput" accept=".xlsx,.xls,.csv" hidden></div></header>
<section class="content" id="view"></section></main></div>
<div class="modal" id="modal"><div class="dialog"><div class="dialoghead"><h3 id="modalTitle">Tambah Data</h3><button class="close" id="closeModal">✕</button></div><form id="dataForm"><div class="formgrid" id="formFields"></div><div class="dialogfoot"><button type="button" class="btn" id="cancelModal">Batal</button><button class="btn primary" type="submit">Simpan Data</button></div></form></div></div>
<script>
const definitions={
plants:{title:'Inventaris Tanaman',key:'ID Tanaman',icon:'🌿',fields:[['ID Tanaman','text'],['Nama Tanaman','text',true],['Varietas/Jenis','text'],['Kelompok','select',['Sayuran','Buah','Hias','Herbal','Obat','Lainnya']],['Lokasi Kebun','text'],['Jumlah/Pot','number'],['Kondisi','select',['Sehat','Perlu Perawatan','Pulih','Mati']],['Status Indukan','select',['Ya','Tidak','Observasi']],['Tanggal Cek Terakhir','date'],['Catatan','textarea']]},
tools:{title:'Inventaris Alat',key:'ID Alat',fields:[['ID Alat','text'],['Nama Alat','text',true],['Kategori','text'],['Merek/Tipe','text'],['Jumlah','number'],['Kondisi','select',['Baik','Perlu Servis','Rusak']],['Lokasi','text'],['Tanggal Beli','date'],['Harga Beli (Rp)','number'],['Servis Terakhir','date'],['Interval Servis (hari)','number'],['Catatan','textarea']]},
materials:{title:'Stok Bahan',key:'Nama Bahan',fields:[['Nama Bahan','text',true],['Kategori','text'],['Satuan','text'],['Stok Awal','number'],['Masuk','number'],['Keluar Lain','number'],['Batas Minimum','number'],['Harga/Satuan (Rp)','number'],['Kedaluwarsa','date'],['Lokasi Simpan','text'],['Catatan','textarea']]},
care:{title:'Log Perawatan',key:'Tanggal',fields:[['Tanggal','date',true],['ID Tanaman','text'],['Nama Tanaman','text'],['Jenis Perawatan','select',['Penyiraman','Pemupukan','Pemangkasan','Pengendalian Hama/Penyakit','Perbaikan Media','Stek','Pemulihan','Lainnya']],['Bahan/Produk','text'],['Dosis/Jumlah','text'],['Biaya (Rp)','number'],['Kondisi Sebelum','text'],['Kondisi Sesudah','text'],['Jadwal Berikutnya','date'],['Catatan','textarea'],['Jumlah Pakai','number'],['Satuan','text']]},
cuttings:{title:'Log Stek',key:'ID Batch',fields:[['Tanggal Stek','date',true],['ID Batch','text'],['ID Indukan','text'],['Nama Tanaman','text'],['Metode','select',['Stek pucuk','Stek batang','Stek daun','Pemisahan anakan','Cangkok','Biji','Lainnya']],['Jumlah Stek','number',true],['Berakar','number'],['Hidup Setelah Pindah','number'],['Media','text'],['Perlakuan','text'],['Tanggal Cek','date'],['Catatan','textarea']]},
stock:{title:'Produksi & Stok',key:'ID Batch',fields:[['ID Batch','text'],['Nama Tanaman','text',true],['Varietas/Jenis','text'],['Tanggal Siap Jual','date'],['Satuan','select',['polybag','pot','tray','batang','pcs']],['Stok Awal','number'],['Produksi Masuk','number'],['Lokasi Simpan','text'],['Status Kualitas','select',['Siap Jual','Perlu Pemulihan','Karantina','Tidak Layak']],['Catatan','textarea'],['Rusak/Mati','number']]},
sales:{title:'Penjualan',key:'No. Transaksi',fields:[['Tanggal','date',true],['No. Transaksi','text'],['Nama Pembeli','text'],['Kanal Penjualan','select',['WhatsApp','Offline','Komunitas','Media Sosial','Marketplace','Lainnya']],['Nama Tanaman/Produk','text',true],['Jumlah Terjual','number',true],['Harga Satuan (Rp)','number',true],['Ongkir Dibayar Pembeli','number'],['Status Pembayaran','select',['Lunas','DP','Belum Bayar','Refund']],['Status Pengiriman','select',['Belum Dikirim','Diproses','Dikirim','Diterima','Batal']],['Catatan','textarea']]},
expenses:{title:'Pengeluaran',key:'Keterangan',fields:[['Tanggal','date',true],['Kategori Biaya','select',['Peralatan','Media Tanam','Pot/Kemasan','Bibit/Indukan','Pupuk','Transportasi','Promosi','Pengiriman','Lainnya']],['Keterangan','text',true],['Jumlah','number',true],['Metode Bayar','select',['Tunai','Transfer','E-wallet','Lainnya']],['Catatan','textarea']]}
};
const names=Object.keys(definitions);let db={};names.forEach(k=>db[k]=[]);let current='dashboard',editing=-1,query='';
const aliases={'Inventaris Tanaman':'plants','Inventaris Alat':'tools','Stok Bahan':'materials','Log Perawatan':'care','Log Stek':'cuttings','Produksi & Stok':'stock','Penjualan':'sales','Pengeluaran':'expenses'};
const rupiah=n=>'Rp '+(Number(n)||0).toLocaleString('id-ID');const num=n=>Number(n)||0;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){localStorage.setItem('kebun59-data-v1',JSON.stringify(db))}
function load(){try{const x=JSON.parse(localStorage.getItem('kebun59-data-v1'));if(x)names.forEach(k=>db[k]=Array.isArray(x[k])?x[k]:[])}catch(e){}}
function rows(k){return db[k]||[]}
function stockNow(r){return num(r['Stok Awal'])+num(r['Produksi Masuk'])-num(r['Rusak/Mati'])-rows('sales').filter(s=>s['Nama Tanaman/Produk']===r['Nama Tanaman']&&!['Refund'].includes(s['Status Pembayaran'])&&s['Status Pengiriman']!=='Batal').reduce((a,s)=>a+num(s['Jumlah Terjual']),0)}
function saleTotal(r){return num(r['Jumlah Terjual'])*num(r['Harga Satuan (Rp)'])}
function metrics(){const plants=rows('plants'),cut=rows('cuttings'),st=rows('stock'),sales=rows('sales').filter(s=>s['Status Pembayaran']!=='Refund'&&s['Status Pengiriman']!=='Batal'),expenses=rows('expenses');return {plants:plants.length,cut:cut.reduce((a,r)=>a+num(r['Jumlah Stek']),0),root:cut.reduce((a,r)=>a+num(r['Berakar']),0),stock:st.reduce((a,r)=>a+Math.max(0,stockNow(r)),0),sales:sales.reduce((a,r)=>a+saleTotal(r),0),units:sales.reduce((a,r)=>a+num(r['Jumlah Terjual']),0),expenses:expenses.reduce((a,r)=>a+num(r['Jumlah']),0)}}
function go(page){current=page;query='';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('pageTitle').textContent=page==='dashboard'?'Dashboard':page==='reports'?'Laporan':page==='guide'?'Panduan':definitions[page].title;document.getElementById('crumb').textContent=document.getElementById('pageTitle').textContent.toUpperCase();document.getElementById('topAdd').style.display=definitions[page]?'inline-block':'none';render()}
function render(){const el=document.getElementById('view');if(current==='dashboard')el.innerHTML=dashboard();else if(current==='reports')el.innerHTML=reports();else if(current==='guide')el.innerHTML=guide();else el.innerHTML=tablePage(current);wirePage()}
function dashboard(){const m=metrics(),rate=m.cut?Math.round(m.root/m.cut*100):0;const low=rows('stock').filter(r=>stockNow(r)<5),due=rows('care').filter(r=>r['Jadwal Berikutnya']&&new Date(r['Jadwal Berikutnya'])<new Date()&&r['Status Jadwal']!=='Selesai');return `
<div class="welcome"><div><h2>Selamat datang di Kebun59 🌱</h2><p>Ringkasan aktivitas kebun dan usaha bibit Anda.</p></div><button class="btn soft" onclick="document.getElementById('fileInput').click()">Import data Excel</button></div>
<div class="cards">
<div class="stat"><div class="stathead">Tanaman terdata <span class="staticon">🌿</span></div><strong>${m.plants}</strong><small>Data inventaris tanaman</small></div>
<div class="stat"><div class="stathead">Total stek dibuat <span class="staticon">✂️</span></div><strong>${m.cut.toLocaleString('id-ID')}</strong><small>${m.root.toLocaleString('id-ID')} berhasil berakar</small></div>
<div class="stat"><div class="stathead">Stok bibit tersedia <span class="staticon">📦</span></div><strong>${m.stock.toLocaleString('id-ID')}</strong><small>Unit siap dipantau</small></div>
<div class="stat"><div class="stathead">Omzet penjualan <span class="staticon">💰</span></div><strong style="font-size:21px">${rupiah(m.sales)}</strong><small>${m.units} unit terjual</small></div>
</div>
<div class="dashgrid"><div class="panel"><div class="panelhead"><div><h3>Ringkasan usaha</h3><p>Akumulasi data yang sudah dicatat</p></div></div>
<div class="bars">
<div class="barrow"><span>Keberhasilan stek</span><div class="track"><div class="fill" style="width:${rate}%"></div></div><b class="barvalue">${rate}%</b></div>
<div class="barrow"><span>Omzet penjualan</span><div class="track"><div class="fill" style="width:${Math.min(100,m.sales/(m.sales+m.expenses||1)*100)}%"></div></div><b class="barvalue">${rupiah(m.sales)}</b></div>
<div class="barrow"><span>Pengeluaran</span><div class="track"><div class="fill" style="width:${Math.min(100,m.expenses/(m.sales+m.expenses||1)*100)}%;background:#d3a35b"></div></div><b class="barvalue">${rupiah(m.expenses)}</b></div>
</div><div style="margin-top:20px;padding-top:15px;border-top:1px solid var(--line);display:flex;justify-content:space-between"><span class="muted">Selisih omzet - pengeluaran</span><b>${rupiah(m.sales-m.expenses)}</b></div></div>
<div class="panel"><div class="panelhead"><div><h3>Perlu perhatian</h3><p>Hal yang perlu ditindaklanjuti</p></div></div>
${low.length?'<div class="alert red">⚠️ '+low.length+' batch bibit memiliki stok kurang dari 5 unit.</div>':'<div class="alert">✓ Belum ada stok bibit di bawah 5 unit.</div>'}
${due.length?'<div class="alert red">🗓️ '+due.length+' jadwal perawatan sudah melewati tanggal rencana.</div>':'<div class="alert">✓ Tidak ada jadwal perawatan terlambat yang terdeteksi.</div>'}
<div class="alert">💡 Import file Excel untuk memuat data awal dari workbook Anda.</div></div></div>
<div class="panel"><div class="panelhead"><div><h3>Stok bibit terbaru</h3><p>Ringkasan batch produksi</p></div><button class="btn" onclick="go('stock')">Lihat semua →</button></div>${miniTable('stock',4)}</div>`}
function miniTable(k,n){const d=definitions[k],list=rows(k).slice(0,n);if(!list.length)return '<div class="empty">Belum ada data. Import workbook atau tambahkan data baru.</div>';return '<div class="tablewrap"><table><thead><tr>'+d.fields.slice(0,4).map(f=>'<th>'+esc(f[0])+'</th>').join('')+'<th>Stok Saat Ini</th></tr></thead><tbody>'+list.map(r=>'<tr>'+d.fields.slice(0,4).map(f=>'<td>'+esc(r[f[0]]||'—')+'</td>').join('')+'<td><b>'+stockNow(r)+'</b></td></tr>').join('')+'</tbody></table></div>'}
function tablePage(k){const d=definitions[k],data=rows(k).filter(r=>Object.values(r).join(' ').toLowerCase().includes(query.toLowerCase()));return `
<div class="welcome"><div><h2>${d.title}</h2><p>Kelola dan perbarui data ${d.title.toLowerCase()}.</p></div><button class="btn primary" onclick="openForm()">+ Tambah Data</button></div>
<div class="panel"><div class="toolbar"><input class="search" id="search" placeholder="Cari data..." value="${esc(query)}"><span class="muted">${data.length} dari ${rows(k).length} data</span><span style="flex:1"></span><button class="btn" onclick="downloadCSV('${k}')">Export CSV</button></div>
<div class="tablewrap"><table><thead><tr>${d.fields.map(f=>'<th>'+esc(f[0])+'</th>').join('')}<th>Aksi</th></tr></thead><tbody>
${data.length?data.map(r=>{const ix=rows(k).indexOf(r);return '<tr>'+d.fields.map(f=>'<td>'+cell(k,r,f[0])+'</td>').join('')+'<td><button class="btn" onclick="openForm('+ix+')">Edit</button> <button class="btn danger" onclick="removeRow('+ix+')">Hapus</button></td></tr>'}).join(''):'<tr><td colspan="'+(d.fields.length+1)+'"><div class="empty">Belum ada data. Klik Tambah Data atau import workbook Excel.</div></td></tr>'}
</tbody></table></div></div>`}
function cell(k,r,key){let v=r[key];if(k==='stock'&&key==='Stok Saat Ini')v=stockNow(r);if(k==='sales'&&key==='Total Penjualan (Rp)')v=rupiah(saleTotal(r));if(k==='cuttings'&&key==='% Berakar')v=num(r['Jumlah Stek'])?Math.round(num(r['Berakar'])/num(r['Jumlah Stek'])*100)+'%':'—';if(k==='cuttings'&&key==='% Bertahan')v=num(r['Jumlah Stek'])?Math.round(num(r['Hidup Setelah Pindah'])/num(r['Jumlah Stek'])*100)+'%':'—';if(key.includes('(Rp)')||key==='Biaya (Rp)')v=v?rupiah(v):'—';if(v===undefined||v===null||v==='')return '—';if(['Kondisi','Status Kualitas','Status Pembayaran','Status Pengiriman'].includes(key)){let c=/rusak|refund|batal|mati|perlu/i.test(v)?'bad':/pulih|proses|dp|kirim|servis/i.test(v)?'warn':'';return '<span class="pill '+c+'">'+esc(v)+'</span>'}return esc(v)}
function reports(){const m=metrics(),by={};rows('sales').forEach(r=>{if(r['Status Pembayaran']!=='Refund'&&r['Status Pengiriman']!=='Batal'){const k=r['Nama Tanaman/Produk']||'Lainnya';by[k]=(by[k]||0)+saleTotal(r)}});const top=Object.entries(by).sort((a,b)=>b[1]-a[1]).slice(0,8);return `<div class="welcome"><div><h2>Laporan & Analisis</h2><p>Performa usaha berdasarkan catatan transaksi dan produksi.</p></div><button class="btn" onclick="exportExcel()">Export Excel</button></div><div class="cards"><div class="stat"><div class="stathead">Omzet</div><strong style="font-size:21px">${rupiah(m.sales)}</strong></div><div class="stat"><div class="stathead">Pengeluaran</div><strong style="font-size:21px">${rupiah(m.expenses)}</strong></div><div class="stat"><div class="stathead">Surplus sederhana</div><strong style="font-size:21px">${rupiah(m.sales-m.expenses)}</strong></div><div class="stat"><div class="stathead">Unit terjual</div><strong>${m.units}</strong></div></div><div class="panel"><div class="panelhead"><div><h3>Penjualan per produk</h3><p>Diurutkan berdasarkan omzet tertinggi</p></div></div><div class="bars">${top.length?top.map(([name,val])=>'<div class="barrow"><span>'+esc(name)+'</span><div class="track"><div class="fill" style="width:'+Math.max(3,val/(top[0][1]||1)*100)+'%"></div></div><b class="barvalue">'+rupiah(val)+'</b></div>').join(''):'<div class="empty">Belum ada transaksi penjualan.</div>'}</div></div><div class="panel"><h3>Catatan perhitungan</h3><p class="muted">Surplus sederhana dihitung dari omzet sah dikurangi pengeluaran yang dicatat. Angka ini belum memperhitungkan HPP, penyusutan aset, atau biaya lain yang belum dimasukkan.</p></div>`}
function guide(){return `<div class="welcome"><div><h2>Panduan Penggunaan</h2><p>Mulai kelola kebun secara bertahap.</p></div></div><div class="guide"><article><b>01 · Inventaris Tanaman</b><p>Masukkan tanaman yang ada, ID unik, varietas, lokasi, kondisi, dan status sebagai indukan.</p></article><article><b>02 · Inventaris Alat</b><p>Catat perlengkapan, jumlah, kondisi, lokasi, serta jadwal servis berikutnya.</p></article><article><b>03 · Stok Bahan</b><p>Catat stok awal dan pembelian bahan. Perbarui pemakaian serta batas minimum secara berkala.</p></article><article><b>04 · Log Perawatan</b><p>Catat penyiraman, pemupukan, pemangkasan, pengendalian hama, dan tanggal perawatan berikutnya.</p></article><article><b>05 · Log Stek</b><p>Satu baris untuk satu batch. Catat jumlah awal, jumlah berakar, dan jumlah hidup setelah pindah.</p></article><article><b>06 · Produksi & Stok</b><p>Catat batch bibit siap jual. Stok dihitung dari stok awal + produksi - rusak - unit penjualan sah.</p></article><article><b>07 · Penjualan</b><p>Satu baris untuk satu produk. Pesanan berisi beberapa produk dapat memakai nomor transaksi yang sama.</p></article><article><b>08 · Pengeluaran</b><p>Masukkan biaya aktual kebun dan usaha agar ringkasan omzet dan biaya lebih akurat.</p></article></div><div class="panel" style="margin-top:16px"><h3>Import dan keamanan data</h3><p class="muted">Gunakan tombol Import Excel untuk memuat workbook Dashboard Kebun dan Usaha Bibit. Data yang diedit disimpan di penyimpanan lokal browser ini. Export Excel secara berkala sebagai cadangan. Data tidak otomatis tersinkron antarperangkat atau antar-browser.</p><button class="btn primary" onclick="document.getElementById('fileInput').click()">Import workbook Excel</button></div>`}
function openForm(ix=-1){if(!definitions[current])return;editing=ix;const d=definitions[current],r=ix>=0?rows(current)[ix]:{};document.getElementById('modalTitle').textContent=(ix>=0?'Edit ':'Tambah ')+d.title;document.getElementById('formFields').innerHTML=d.fields.map((f,i)=>{const [label,type,required,opts]=f;let value=r[label]??'';let input=type==='select'?'<select name="'+esc(label)+'"><option value="">Pilih...</option>'+opts.map(o=>'<option '+(value===o?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select>':type==='textarea'?'<textarea name="'+esc(label)+'">'+esc(value)+'</textarea>':'<input name="'+esc(label)+'" type="'+type+'" value="'+esc(value)+'" '+(required===true?'required':'')+'>';return '<div class="field '+(type==='textarea'?'full':'')+'"><label>'+esc(label)+(required===true?' *':'')+'</label>'+input+'</div>'}).join('');document.getElementById('modal').classList.add('show')}
function closeForm(){document.getElementById('modal').classList.remove('show')}
function removeRow(ix){if(confirm('Hapus data ini?')){rows(current).splice(ix,1);persist();render()}}
function saveForm(e){e.preventDefault();const d=definitions[current],obj={};new FormData(e.target).forEach((v,k)=>obj[k]=v);d.fields.forEach(f=>{if(f[1]==='number')obj[f[0]]=obj[f[0]]===''?'':num(obj[f[0]])});if(current==='sales')obj['No. Transaksi']=obj['No. Transaksi']||'TRX-'+new Date().getFullYear()+'-'+String(Date.now()).slice(-5);if(current==='plants'&&!obj['ID Tanaman'])obj['ID Tanaman']=makeId(obj['Nama Tanaman']);if(current==='tools'&&!obj['ID Alat'])obj['ID Alat']=makeId(obj['Nama Alat']);if(current==='stock'&&!obj['ID Batch'])obj['ID Batch']='BATCH-'+Date.now();if(current==='cuttings'&&!obj['ID Batch'])obj['ID Batch']='STEK-'+Date.now();if(editing>=0)rows(current)[editing]=obj;else rows(current).push(obj);persist();closeForm();render()}
function makeId(s){return (String(s||'TAN').replace(/[^a-z]/gi,'').slice(0,3).toUpperCase()||'TAN')+'-'+String(Date.now()).slice(-4)}
function downloadCSV(k){const d=definitions[k],data=rows(k);const csv=[d.fields.map(f=>f[0]),...data.map(r=>d.fields.map(f=>r[f[0]]??''))].map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download=k+'-kebun59.csv';a.click();URL.revokeObjectURL(a.href)}
function exportExcel(){if(!window.XLSX){alert('Library Excel belum tersedia.');return}const wb=XLSX.utils.book_new();Object.entries(aliases).forEach(([sheet,k])=>{const d=definitions[k];const data=rows(k).map(r=>({...r,...(k==='stock'?{'Stok Saat Ini':stockNow(r)}:{}),(k==='sales'?{'Total Penjualan (Rp)':saleTotal(r)}:{}))}));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data.length?data:[Object.fromEntries(d.fields.map(f=>[f[0],'']))]),sheet)});XLSX.writeFile(wb,'Kebun59-Data.xlsx')}
function importExcel(file){if(!window.XLSX){alert('Tidak dapat memuat library Excel. Periksa koneksi internet.');return}const reader=new FileReader();reader.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});let imported=0;Object.entries(aliases).forEach(([sheet,k])=>{const actual=wb.SheetNames.find(s=>s.toLowerCase()===sheet.toLowerCase());if(!actual)return;const raw=XLSX.utils.sheet_to_json(wb.Sheets[actual],{range:3,defval:'',raw:false});const fields=definitions[k].fields.map(f=>f[0]);const clean=raw.map(r=>{const o={};fields.forEach(f=>o[f]=r[f]??'');return o}).filter(r=>Object.values(r).some(v=>v!==''));if(clean.length){db[k]=clean;imported+=clean.length}});persist();render();alert('Import selesai: '+imported+' baris data dimuat dari workbook.')}catch(err){alert('Gagal membaca file: '+err.message)}};reader.readAsArrayBuffer(file)}
function wirePage(){const s=document.getElementById('search');if(s)s.addEventListener('input',e=>{query=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('search');n.focus();n.setSelectionRange(pos,pos)})}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)go(b.dataset.page)});document.getElementById('topAdd').onclick=()=>openForm();document.getElementById('closeModal').onclick=closeForm;document.getElementById('cancelModal').onclick=closeForm;document.getElementById('dataForm').onsubmit=saveForm;document.getElementById('importBtn').onclick=()=>document.getElementById('fileInput').click();document.getElementById('fileInput').onchange=e=>{if(e.target.files[0])importExcel(e.target.files[0]);e.target.value=''};document.getElementById('exportBtn').onclick=exportExcel;document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeForm()});
load();go('dashboard');
</script></body></html>
